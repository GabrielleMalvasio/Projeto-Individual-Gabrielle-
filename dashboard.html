<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Corpo & Mente</title>

    <link rel="stylesheet" href="Estilos/dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        h1 {
            margin-bottom: 20px;
            text-align: center;
        }

        .card {
            width: 80%;
            max-width: 1000px;
            margin: 20px auto;
            background: #FAFAF8;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);
        }

        canvas {
            width: 100% !important;
            height: 400px !important;
        }

        .containerDashboard {
            margin-left: 150px; 
        }

        .sidebarDashboard {
            position: fixed;
            left: 0;
            top: 0;
            width: 150px;
            height: 100vh;
            background: #32b9cd;
            padding: 20px;
            color: white;
        }

        .logoSidebar {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 40px;
        }

        .voltarSite {
            display: block;
            color: white;
            text-decoration: none;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>


<div class="sidebarDashboard">

    <div class="logoSidebar">
        Corpo <br>
        & Mente
    </div>

    <a href="dashboard.html" class="voltarSite">📊 KPIs</a>
    <a href="graficos.html" class="voltarSite">📈 Gráficos</a>
    <a href="index.html" class="voltarSite">⬅ Voltar ao site</a>
    <a href="#" onclick="sairConta()" class="voltarSite">
    🚪 Sair da conta
</a>

</div>


<section class="containerDashboard">

    <h1>Dashboard de Emoções</h1>

   
    <section class="kpisDashboard">

        <div class="cardKpiDashboard">
            <h2 class="numeroKpiDashboard" id="kpiTotal">0</h2>
            <p class="textoKpiDashboard">Total de votos</p>
        </div>

        <div class="cardKpiDashboard">
            <h2 class="numeroKpiDashboard" id="kpiMelhoraram">0</h2>
            <p class="textoKpiDashboard">Melhoraram</p>
        </div>

        <div class="cardKpiDashboard">
            <h2 class="numeroKpiDashboard" id="kpiPioraram">0</h2>
            <p class="textoKpiDashboard">Pioraram</p>
        </div>

        <div class="cardKpiDashboard">
            <h2 class="numeroKpiDashboard" id="kpiIguais">0</h2>
            <p class="textoKpiDashboard">Iguais</p>
        </div>

        <div class="cardKpiDashboard">
            <h2 class="numeroKpiDashboard" id="kpiMelhoria">0%</h2>
            <p class="textoKpiDashboard">Melhora emocional</p>
        </div>

    </section>

</section>


<script>

if (!sessionStorage.ID_USUARIO) {
    alert("Você precisa estar logado para acessar o dashboard.");
    window.location = "login.html";

}

console.log("Dashboard rodando");

function sairConta() {
    sessionStorage.clear();
    alert("Você saiu da conta");
    window.location = "login.html";
}

window.onload = function () {

    fetch("http://localhost:3333/voto/variacao")
        .then(res => res.json())
        .then(dados => {

            let melhoraram = 0;
            let pioraram = 0;
            let iguais = 0;

            for (let i = 0; i < dados.length; i++) {

                let variacao = dados[i].variacao;
                let total = Number(dados[i].total);

                if (variacao == "Melhoraram") {
                    melhoraram = total;
                } else if (variacao == "Pioraram") {
                    pioraram = total;
                } else {
                    iguais = total;
                }
            }

            let totalVotos = melhoraram + pioraram + iguais;

            document.getElementById("kpiTotal").innerHTML = totalVotos;
            document.getElementById("kpiMelhoraram").innerHTML = melhoraram;
            document.getElementById("kpiPioraram").innerHTML = pioraram;
            document.getElementById("kpiIguais").innerHTML = iguais;

            // KPI melhora emocional
            let melhoria = 0;

            if (totalVotos > 0) {
                melhoria = ((melhoraram - pioraram) / totalVotos) * 100;
            }

            document.getElementById("kpiMelhoria").innerHTML =
                (melhoria >= 0 ? "+" : "") + melhoria.toFixed(1) + "%";

        })
        .catch(erro => {
            console.log("ERRO DASH:", erro);
        });

};

</script>

</body>
</html>
