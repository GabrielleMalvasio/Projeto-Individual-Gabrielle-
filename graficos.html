<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Gráficos - Corpo & Mente</title>

    <link rel="stylesheet" href="Estilos/dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        h1 {
            margin-bottom: 20px;
            text-align: center;
        }

        .card {
            width: 80%;
            max-width: 1000px;
            margin: 20px auto;
            background: #FAFAF8;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);
        }

        canvas {
            width: 100% !important;
            height: 400px !important;
        }

        .containerDashboard {
            margin-left: 150px; 
        }

        .sidebarDashboard {
            position: fixed;
            left: 0;
            top: 0;
            width: 150px;
            height: 100vh;
            background: #32b9cd;
            padding: 20px;
            color: white;
        }

        .logoSidebar {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 40px;
        }

        .voltarSite {
            display: block;
            color: white;
            text-decoration: none;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

<div class="sidebarDashboard">

    <div class="logoSidebar">
        Corpo <br>
        & Mente
    </div>

    <a href="dashboard.html" class="voltarSite">📊 KPIs</a>
    <a href="graficos.html" class="voltarSite">📈 Gráficos</a>
    <a href="index.html" class="voltarSite">⬅ Voltar ao site</a>
    <a href="#" onclick="sairConta()" class="voltarSite">
    🚪 Sair da conta
</a>

</div>


<section class="containerDashboard">

    <h1>Gráficos</h1>

    <div class="card">
        <canvas id="graficoVariacao"></canvas>
    </div>

    <div class="card">
        <canvas id="graficoMedias"></canvas>
    </div>

</section>

<script>


if (!sessionStorage.ID_USUARIO) {
    alert("Você precisa estar logado para acessar os gráficos.");
    window.location = "login.html";
}

function sairConta() {
    sessionStorage.clear();
    alert("Você saiu da conta");
    window.location = "login.html";
}

window.onload = function () {

    fetch("http://localhost:3333/voto/emocoesAntes")

    .then(res => res.json())

    .then(dados => {

        let labels = [];
        let valores = [];

        for (let i = 0; i < dados.length; i++) {

            let emocao = dados[i].emocao_antes;

            if (emocao == 1) {

                labels.push("😁 Muito feliz");

            } else if (emocao == 2) {

                labels.push("🙂 Feliz");

            } else if (emocao == 3) {

                labels.push("😐 Neutro");

            } else if (emocao == 4) {

                labels.push("🙁 Pouco triste");

            } else if (emocao == 5) {

                labels.push("😢 Triste");

            } else if (emocao == 6) {

                labels.push("😭 Muito triste");

            }

            valores.push(dados[i].total);
        }

        const ctx = document.getElementById("graficoVariacao");

        new Chart(ctx, {

            type: "bar",

            data: {

                labels: labels,

                datasets: [{

                    label: "Quantidade de votos",

                    data: valores,

                    backgroundColor: [
                        "#4CAF50",
                        "#8BC34A",
                        "#FFC107",
                        "#FF9800",
                        "#F44336",
                        "#B71C1C"
                    ]

                }]
            },

            options: {

                indexAxis: 'y',

                responsive: true,

                plugins: {

                    title: {

                        display: true,

                        text: "Emoções antes da leitura"

                    }
                },

                scales: {

                    x: {

                        beginAtZero: true

                    }
                }
            }
        });

    });


    
    fetch("http://localhost:3333/voto/emocoesDepois")
.then(res => res.json())
.then(dados => {

    let labels = [];
    let valores = [];

    for (let i = 0; i < dados.length; i++) {

        let emocao = dados[i].emocao_depois;

        if (emocao == 1) {

    labels.push("😁 Muito feliz");

} else if (emocao == 2) {

    labels.push("🙂 Feliz");

} else if (emocao == 3) {

    labels.push("😐 Neutro");

} else if (emocao == 4) {

    labels.push("🙁 Pouco triste");

} else if (emocao == 5) {

    labels.push("😢 Triste");

} else if (emocao == 6) {

    labels.push("😭 Muito triste");

}

        valores.push(dados[i].total);
    }

    const ctx = document.getElementById("graficoMedias");

    new Chart(ctx, {
        type: "bar",

        data: {
            labels: labels,

            datasets: [{
                label: "Quantidade de votos",
                data: valores,
                backgroundColor: [
                 "#4CAF50",
                 "#8BC34A",
                "#FFC107",
                "#FF9800",
                "#F44336",
                "#B71C1C"
]
            }]
        },

        options: {
            indexAxis: 'y',

            responsive: true,

            plugins: {
                title: {
                    display: true,
                    text: "Emoções mais escolhidas depois da leitura"
                }
            },

            scales: {
                x: {
                    beginAtZero: true
                }
            }
        }
    });

});

};

</script>

</body>
</html>
